name: Build Debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 17

      - name: Install Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;35.0.0"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: angrybirds-auto-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the existing release ID for v1.0.0-debug
          RELEASE_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/kaine28rin-eng/angrybirds-auto/releases/tags/v1.0.0-debug" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")

          # Delete old asset if it exists (GitHub doesn't allow duplicate asset names)
          curl -s -X GET -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/kaine28rin-eng/angrybirds-auto/releases/$RELEASE_ID/assets" \
            | python3 -c "
          import sys, json
          assets = json.load(sys.stdin)
          for asset in assets:
              if asset['name'] == 'app-debug.apk':
                  print(asset['id'])
          " | while read ASSET_ID; do
              curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/kaine28rin-eng/angrybirds-auto/releases/assets/$ASSET_ID"
          done

          # Upload the new APK asset
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @app/build/outputs/apk/debug/app-debug.apk \
            "https://uploads.github.com/repos/kaine28rin-eng/angrybirds-auto/releases/$RELEASE_ID/assets?name=app-debug.apk"
